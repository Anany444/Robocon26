controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

    extrusion_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/JointGroupPositionController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

mecanum_drive_controller:
  ros__parameters:
    front_left_wheel_command_joint_name: "left_front_wheel_joint"
    front_right_wheel_command_joint_name: "right_front_wheel_joint"
    rear_left_wheel_command_joint_name: "left_back_wheel_joint"
    rear_right_wheel_command_joint_name: "right_back_wheel_joint"
    front_left_wheel_state_joint_name: "left_front_wheel_joint"
    front_right_wheel_state_joint_name: "right_front_wheel_joint"
    rear_left_wheel_state_joint_name: "left_back_wheel_joint"
    rear_right_wheel_state_joint_name: "right_back_wheel_joint"
    kinematics:
      wheels_radius: 0.05
      sum_of_robot_center_projection_on_X_Y_axis: 0.63
    reference_timeout: 0.5
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    use_stamped_vel: false

extrusion_controller:
  ros__parameters:
    joints:
      - left_front_extrusion_joint
      - right_front_extrusion_joint
      - left_back_extrusion_joint
      - right_back_extrusion_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

gripper_controller:
  ros__parameters:
    joints:
      - left_gripper_joint
      - right_gripper_joint
    interface_name: position

arm_controller:
  ros__parameters:
    joints:
      - left_arm_joint
      - right_arm_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
