constants:
  bot_length: 0.8     # The physical length of the robot in meters
  caster_margin: 0.18 # Margin for front casters to be placed squarely on the block
  clearance: 1.0      # Safety clearance buffer (in meters) before final approach
  block_side: 1.2     # The side length of the block in meters

locations:
  check_block2_kfs:
    waypoints:
      - x: "3.0"
        y: "-4.2"  # Modify this to the actual checking location
        yaw: "math.pi / 2.0"

  block2_approach:
    waypoints:
      - x: "3.0"
        y: "-2.2 - (block_side / 2.0) - (bot_length / 2.0) + caster_margin"
        yaw: "math.pi / 2.0"

  block2_climb_mid:
    waypoints:
      - x: "3.0"
        y: "-2.6"
        yaw: "math.pi / 2.0"

  block2_center:
    waypoints:
      - x: "3.0"
        y: "-2.2"
        yaw: "math.pi / 2.0"

  waiting_r1_kfs_block2_pickup:
    waypoints:
      - x: "3.0"   # Modify this to the exact waiting location
        y: "-3.6"  # Modify this to the exact waiting location
        yaw: "math.pi / 2.0"

      - x: "4.0"
        y: "-3.6"
        yaw: "math.pi / 2.0"
