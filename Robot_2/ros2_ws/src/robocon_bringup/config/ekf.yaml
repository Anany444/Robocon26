ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: false
    publish_tf: true
    
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    
    
    # ICP Odometry (Highly accurate 6-DoF absolute pose)
    odom1: /icp_odom
    odom1_config: [true,  true,  true,
                   true,  true,  true,
                   true,  true,  true,
                   true, true, true,
                   false, false, false]
    
    # IMU (Provides robust orientation and angular velocity)
    imu0: /imu
    imu0_config: [false, false, false,
                  false,  false,  false,
                  false, false, false,
                  false,  false,  true,
                  false, false, false]
    # imu0_remove_gravitational_acceleration: true
    
    # Advanced settings
    publish_acceleration: false
    print_diagnostics: true
